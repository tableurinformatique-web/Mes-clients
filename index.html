<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liste de clients</title>
<style>
body{font-family:Arial; padding:12px; background:#f2f2f2}
h2{text-align:center}
.box{background:white; padding:12px; border-radius:10px; margin-bottom:10px; text-align:center}
.vert{color:green} .rouge{color:red}
button{padding:10px 14px; margin:3px; border:none; border-radius:8px; background:#007bff; color:white; font-weight:bold}
.btnRouge{background:#dc3545} .btnVert{background:#28a745}
input,select{padding:7px; border:1px solid #ccc; border-radius:6px; font-size:14px; width:95%}
table{width:100%; background:white; border-collapse:collapse; margin-top:10px}
th,td{border:1px solid #ddd; padding:6px; text-align:center; font-size:13px}
th{background:#007bff; color:white}
.total td{background:#e9f5ff; font-weight:bold}
.bon{background:#d4edda} .moyen{background:#fff3cd} .mauvais{background:#f8d7da}
</style>
</head>
<body>
<h2>Liste de clients</h2>

<div class="box">
Capital de départ : <input id="capital" type="number" value="100000" style="width:110px" oninput="calculer()"><br>
Pourcentage de départ : <input id="pourcGlobal" type="number" value="30" style="width:60px" oninput="changerPourc()"> %<br><br>
<b>Total Prêté : <span id="tPrete">0</span></b> | <b>Profit : <span id="tProfit">0</span></b> | <b>Capital Actuel : <span id="tCapital">0</span></b><br>
<b id="evolCapital" class="vert">📈 CAPITAL AGRANDIT</b>
</div>

<div class="box">
🔍 Recherche : <input id="recherche" placeholder="Nom ou téléphone..." oninput="filtrer()" style="width:80%"><br><br>
<button onclick="ajouter()">+ Ajouter une ligne vide</button>
<button onclick="calculer()" class="btnVert">CALCULER + SAUVEGARDER</button>
</div>

<table id="table">
<tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Montant crédité</th><th>Date</th><th>%</th><th>Profit</th><th>Rembourse</th><th>Statut</th><th>Évolution Client</th><th>Supprimer</th></tr>
</table>

<script>
let n=0;
function creerLigne(c={}){
n++;
let tr=document.createElement("tr");
let pourc=c.pourc!==undefined?c.pourc:(document.getElementById("pourcGlobal").value||30);
tr.innerHTML=`
<td><input class="code" value="${c.code||''}" placeholder="C001" oninput="calculer()"></td>
<td><input class="nom" value="${c.nom||''}" placeholder="Nom" oninput="calculer()"></td>
<td><input class="tel" value="${c.tel||''}" placeholder="097..." oninput="calculer()"></td>
<td><input class="montant" type="number" value="${c.montant||''}" placeholder="Montant" oninput="calculer()"></td>
<td><input class="date" type="date" value="${c.date||''}" oninput="calculer()"></td>
<td><input class="pourc" type="number" value="${pourc}" oninput="calculer()" style="width:60px">%</td>
<td class="profit">0</td>
<td class="remb">0</td>
<td><select class="statut" onchange="calculer()"><option>Non payé</option><option>Payé partiel</option><option>Payé</option></select></td>
<td><select class="evol" onchange="colorEvol(this);calculer()"><option>Bon</option><option>Moyen</option><option>Mauvais</option></select></td>
<td><button class="btnRouge" onclick="supprimer(this)">X</button></td>`;
document.getElementById("table").appendChild(tr);
if(c.statut) tr.querySelector(".statut").value=c.statut;
if(c.evol) tr.querySelector(".evol").value=c.evol;
colorEvol(tr.querySelector(".evol"));
}
function changerPourc(){ let v=document.getElementById("pourcGlobal").value||30; document.querySelectorAll(".pourc").forEach(i=>i.value=v); calculer(); }
function colorEvol(sel){ sel.classList.remove("bon","moyen","mauvais"); if(sel.value=="Bon") sel.classList.add("bon"); if(sel.value=="Moyen") sel.classList.add("moyen"); if(sel.value=="Mauvais") sel.classList.add("mauvais"); }
function ajouter(){ creerLigne({}); calculer(); }
function supprimer(btn){ if(confirm("Supprimer ?")){ btn.closest("tr").remove(); calculer(); } }
function calculer(){
let rows=document.querySelectorAll("#table tr");
let totPrete=0, totProfit=0, data=[];
for(let i=1;i<rows.length;i++){
let r=rows[i];
let montant=Number(r.querySelector(".montant").value||0);
let pourc=Number(r.querySelector(".pourc").value||30);
let profit=Math.round(montant*pourc/100);
r.querySelector(".profit").innerText=profit;
r.querySelector(".remb").innerText=montant+profit;
totPrete+=montant; totProfit+=profit;
data.push({code:r.querySelector(".code").value, nom:r.querySelector(".nom").value, tel:r.querySelector(".tel").value, montant:montant, date:r.querySelector(".date").value, pourc:pourc, statut:r.querySelector(".statut").value, evol:r.querySelector(".evol").value});
}
let capital=Number(document.getElementById("capital").value||0);
document.getElementById("tPrete").innerText=totPrete;
document.getElementById("tProfit").innerText=totProfit;
document.getElementById("tCapital").innerText=capital+totProfit;
let ev=document.getElementById("evolCapital");
if(totProfit>0){ ev.innerText="📈 CAPITAL AGRANDIT +"+totProfit; ev.className="vert"; }
else if(totProfit==0){ ev.innerText="➖ CAPITAL STABLE"; ev.className=""; }
localStorage.setItem("clients_final",JSON.stringify(data));
localStorage.setItem("capital_final",capital);
localStorage.setItem("pourc_final",document.getElementById("pourcGlobal").value);
}
function filtrer(){ let mot=document.getElementById("recherche").value.toLowerCase(); let rows=document.querySelectorAll("#table tr"); for(let i=1;i<rows.length;i++){ rows[i].style.display=rows[i].innerText.toLowerCase().includes(mot)||rows[i].querySelector(".nom").value.toLowerCase().includes(mot)?"":"none"; } }
window.onload=function(){
let cap=localStorage.getItem("capital_final"); if(cap) document.getElementById("capital").value=cap;
let pf=localStorage.getItem("pourc_final"); if(pf) document.getElementById("pourcGlobal").value=pf;
let sauve=localStorage.getItem("clients_final");
if(sauve && JSON.parse(sauve).length>0){ JSON.parse(sauve).forEach(c=>creerLigne(c)); } else { creerLigne({}); }
calculer();
}
</script>
</body>
</html>

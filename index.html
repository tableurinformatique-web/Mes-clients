<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TABLEUR INFORMATIQUE</title>
<style>
body{font-family:Arial; padding:10px; background:#eef2f7; margin:0}
.header{background:#0b2e59; color:white; padding:14px; text-align:center; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:12px}
.logo{width:55px; height:55px; background:#ff7a00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; color:white; border:3px solid white}
.header h1{margin:0; font-size:22px}
.box{background:white; padding:12px; border-radius:10px; margin:10px 0; text-align:center}
button{padding:10px 12px; margin:3px; border:none; border-radius:8px; background:#007bff; color:white; font-weight:bold; cursor:pointer}
.btnVert{background:#28a745} .btnNoir{background:#222} .btnOrange{background:#2b579a} .btnW{background:#25D366} .btnRecu{background:#6f42c1} .btnRouge{background:#dc3545}
input,select{padding:7px; border:1px solid #ccc; border-radius:6px; font-size:13px; width:95%}
table{width:100%; background:white; border-collapse:collapse; margin-top:10px; font-size:12px}
th,td{border:1px solid #ddd; padding:6px; text-align:center}
th{background:#0b2e59; color:white}
.retard{background:#ffe0e0 !important}
.badgeRetard{background:#dc3545; color:white; padding:3px 6px; border-radius:10px; font-size:11px; font-weight:bold}
.badgeOK{background:#28a745; color:white; padding:3px 6px; border-radius:10px; font-size:11px}
#recuBox{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:999; padding:20px; overflow:auto}
#debug{background:#fff3cd; border:2px solid #ff7a00; padding:10px; border-radius:10px; margin:10px 0; text-align:center; font-size:14px}
</style>
</head>
<body>
<div class="header"><div class="logo">TI</div><div style="text-align:left"><h1>TABLEUR INFORMATIQUE</h1><p>Lubumbashi - En Dollars $</p></div></div>

<div id="debug">🔍 TEST SAUVEGARDE : <span id="debugText">Chargement...</span></div>

<div class="box">
Capital : <input id="capital" type="number" value="1000" style="width:100px" oninput="calculer()"> $ | % : <input id="pourcGlobal" type="number" value="30" style="width:60px" oninput="changerPourc()"> %<br>
<b>Total Prêté : <span id="tPrete">0</span> $ | Profit : <span id="tProfit">0</span> $ | À Récupérer : <span id="tReste">0</span> $ | Capital : <span id="tCapital">0</span> $</b><br>
<span id="saveStatus" style="color:green; font-weight:bold">-</span>
</div>

<div class="box">
<button onclick="ajouter()">+ Ajouter client</button>
<button onclick="sauvegarder(true)" class="btnVert">💾 SAUVEGARDER</button><br>
<button onclick="telechargerSauvegarde()" style="background:#6f42c1">⬇️ TÉLÉCHARGER MON FICHIER DE SAUVEGARDE</button><br>
<label style="background:#ff7a00; color:white; padding:10px 12px; border-radius:8px; font-weight:bold; cursor:pointer; display:inline-block; margin:3px">📂 OUVRIR MON FICHIER SAUVEGARDÉ<input type="file" id="fichierRestore" accept=".json" style="display:none" onchange="restaurerSauvegarde(event)"></label><br>
<button onclick="window.print()" class="btnNoir">🖨️ IMPRIMER</button>
<button onclick="exporterWord()" class="btnOrange">📄 WORD</button>
</div>

<div style="overflow-x:auto"><table id="table"><tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Montant $</th><th>Date</th><th>Date Limite</th><th>Alerte</th><th>%</th><th>Profit $</th><th>Rembourse $</th><th>Payé $</th><th>Reste $</th><th>Date Remb.</th><th>Statut</th><th>Évolution</th><th>WhatsApp</th><th>Reçu</th><th>X</th></tr></table></div>

<div id="recuBox"><div id="recuContenu"></div><div style="text-align:center"><button onclick="window.print()" class="btnNoir">🖨️ IMPRIMER REÇU</button><button onclick="document.getElementById('recuBox').style.display='none'" class="btnRouge">FERMER</button></div></div>

<script>
function collectData(){ let rows=document.querySelectorAll("#table tr"); let data=[]; for(let i=1;i<rows.length;i++){ let r=rows[i]; data.push({code:r.querySelector(".code").value, nom:r.querySelector(".nom").value, tel:r.querySelector(".tel").value, montant:r.querySelector(".montant").value, date:r.querySelector(".date").value, dateLimite:r.querySelector(".dateLimite").value, pourc:r.querySelector(".pourc").value, paye:r.querySelector(".paye").value, dateRemb:r.querySelector(".dateRemb").value, statut:r.querySelector(".statut").value, evol:r.querySelector(".evol").value}); } return data; }
function sauvegarder(manuel){
let data=collectData();
let obj={clients:data, capital:document.getElementById("capital").value, pourc:document.getElementById("pourcGlobal").value};
try{ localStorage.setItem("TABLEUR_FINAL", JSON.stringify(obj)); document.getElementById("saveStatus").innerText="✅ Sauvegardé à "+new Date().toLocaleTimeString('fr-FR')+" - "+data.length+" clients"; document.getElementById("debugText").innerText="✅ Ton téléphone accepte la sauvegarde. "+data.length+" clients en mémoire."; if(manuel) alert("✅ SAUVEGARDÉ ! "+data.length+" clients. Maintenant clique aussi sur TÉLÉCHARGER pour garder le fichier."); }catch(e){ document.getElementById("debugText").innerText="❌ Ton navigateur BLOQUE la sauvegarde. Utilise le bouton TÉLÉCHARGER, c'est lui qui va te sauver."; document.getElementById("saveStatus").innerText="❌ Sauvegarde bloquée - Utilise TÉLÉCHARGER"; if(manuel) alert("❌ Ton navigateur bloque la sauvegarde automatique. Utilise le bouton VIOLET TÉLÉCHARGER, c'est la solution."); }
}
function telechargerSauvegarde(){ let obj={clients:collectData(), capital:document.getElementById("capital").value, pourc:document.getElementById("pourcGlobal").value}; let blob=new Blob([JSON.stringify(obj)], {type:"application/json"}); let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mes-clients-tableur.json"; a.click(); alert("✅ Fichier téléchargé ! Garde-le dans ton téléphone. Pour rouvrir tes clients, clique sur OUVRIR MON FICHIER et choisis ce fichier."); }
function restaurerSauvegarde(e){ let f=e.target.files[0]; if(!f) return; let reader=new FileReader(); reader.onload=function(){ try{ let obj=JSON.parse(reader.result); document.getElementById("capital").value=obj.capital||1000; document.getElementById("pourcGlobal").value=obj.pourc||30; document.querySelectorAll("#table tr").forEach((r,i)=>{ if(i>0) r.remove(); }); obj.clients.forEach(c=>creerLigne(c)); calculer(); sauvegarder(false); alert("✅ "+obj.clients.length+" clients retrouvés depuis ton fichier !"); }catch(err){ alert("Fichier invalide"); } }; reader.readAsText(f); }
function creerLigne(c={}){ let tr=document.createElement("tr"); let pourc=c.pourc!==undefined?c.pourc:(document.getElementById("pourcGlobal").value||30); tr.innerHTML=`<td><input class="code" value="${c.code||''}" placeholder="C001" oninput="calculer()"></td><td><input class="nom" value="${c.nom||''}" placeholder="Nom" oninput="calculer()"></td><td><input class="tel" value="${c.tel||''}" placeholder="097..." oninput="calculer()"></td><td><input class="montant" type="number" value="${c.montant||''}" placeholder="0" oninput="calculer()"></td><td><input class="date" type="date" value="${c.date||''}" oninput="calculer()"></td><td><input class="dateLimite" type="date" value="${c.dateLimite||''}" oninput="calculer()"></td><td class="alerte">-</td><td><input class="pourc" type="number" value="${pourc}" oninput="calculer()" style="width:50px">%</td><td class="profit">0</td><td class="remb">0</td><td><input class="paye" type="number" value="${c.paye||0}" oninput="calculer()"></td><td class="reste">0</td><td><input class="dateRemb" type="date" value="${c.dateRemb||''}" oninput="calculer()"></td><td><select class="statut" onchange="calculer()"><option>Non payé</option><option>Payé partiel</option><option>Payé</option></select></td><td><select class="evol" onchange="calculer()"><option>Bon</option><option>Moyen</option><option>Mauvais</option></select></td><td><button class="btnW" onclick="whatsapp(this)">💬</button></td><td><button class="btnRecu" onclick="voirRecu(this)">🧾</button></td><td><button class="btnRouge" onclick="supprimer(this)">X</button></td>`; document.getElementById("table").appendChild(tr); if(c.statut) tr.querySelector(".statut").value=c.statut; if(c.evol) tr.querySelector(".evol").value=c.evol; }
function changerPourc(){ let v=document.getElementById("pourcGlobal").value||30; document.querySelectorAll(".pourc").forEach(i=>i.value=v); calculer(); }
function ajouter(){ creerLigne({}); calculer(); }
function supprimer(btn){ if(confirm("Supprimer ?")){ btn.closest("tr").remove(); calculer(); } }
function calculer(){ let rows=document.querySelectorAll("#table tr"); let totPrete=0, totProfit=0, totRemb=0, totPaye=0, totReste=0; let aujourd=new Date(); aujourd.setHours(0,0,0,0); for(let i=1;i<rows.length;i++){ let r=rows[i]; let montant=Number(r.querySelector(".montant").value||0); let pourc=Number(r.querySelector(".pourc").value||30); let paye=Number(r.querySelector(".paye").value||0); let profit=Math.round(montant*pourc/100); let remb=montant+profit; let reste=remb-paye; r.querySelector(".profit").innerText=profit; r.querySelector(".remb").innerText=remb; r.querySelector(".reste").innerText=reste; let lim=r.querySelector(".dateLimite").value; let al=r.querySelector(".alerte"); if(lim && reste>0 && new Date(lim)<aujourd){ al.innerHTML='<span class="badgeRetard">EN RETARD</span>'; r.classList.add("retard"); } else if(reste<=0){ al.innerHTML='<span class="badgeOK">OK</span>'; r.classList.remove("retard"); } else { al.innerHTML='-'; r.classList.remove("retard"); } totPrete+=montant; totProfit+=profit; totRemb+=remb; totPaye+=paye; totReste+=reste; } let capital=Number(document.getElementById("capital").value||0); document.getElementById("tPrete").innerText=totPrete; document.getElementById("tProfit").innerText=totProfit; document.getElementById("tReste").innerText=totReste; document.getElementById("tCapital").innerText=capital+totProfit; sauvegarder(false); }
function whatsapp(btn){ let r=btn.closest("tr"); let nom=r.querySelector(".nom").value||"Client"; let tel=r.querySelector(".tel").value||""; let reste=r.querySelector(".reste").innerText; let lim=r.querySelector(".dateLimite").value||""; let tc=tel.replace(/[^0-9]/g,""); if(tc.startsWith("0")) tc="243"+tc.substring(1); window.open("https://wa.me/"+tc+"?text="+encodeURIComponent(`Bonjour ${nom}, c'est TABLEUR INFORMATIQUE. Rappel : il vous reste $ ${reste} à payer. Date limite : ${lim}. Merci.`), "_blank"); }
function voirRecu(btn){ let r=btn.closest("tr"); document.getElementById("recuContenu").innerHTML=`<div style="max-width:500px; margin:auto; border:2px solid #0b2e59; padding:20px;"><h2 style="text-align:center; color:#0b2e59">TABLEUR INFORMATIQUE - Reçu</h2><p>Client : ${r.querySelector(".nom").value} - Tel : ${r.querySelector(".tel").value}</p><p>Montant : $ ${r.querySelector(".montant").value} | Profit : $ ${r.querySelector(".profit").innerText} | Total : $ ${r.querySelector(".remb").innerText}</p><p>Payé : $ ${r.querySelector(".paye").value} | Reste : $ ${r.querySelector(".reste").innerText}</p><p>Signature : _______________</p></div>`; document.getElementById("recuBox").style.display="block"; }
function exporterWord(){ let rows=document.querySelectorAll("#table tr"); let lignes=""; for(let i=1;i<rows.length;i++){ let r=rows[i]; lignes+=`<tr><td>${r.querySelector(".code").value}</td><td>${r.querySelector(".nom").value}</td><td>${r.querySelector(".tel").value}</td><td>$ ${r.querySelector(".montant").value}</td><td>$ ${r.querySelector(".remb").innerText}</td><td>$ ${r.querySelector(".reste").innerText}</td></tr>`; } let html=`<html><body><h1>TABLEUR INFORMATIQUE</h1><table border='1'><tr><th>Code</th><th>Nom</th><th>Tel</th><th>Montant</th><th>Rembourse</th><th>Reste</th></tr>${lignes}</table></body></html>`; let blob=new Blob(['\ufeff', html], {type:'application/msword'}); let url=URL.createObjectURL(blob); let a=document.createElement("a"); a.href=url; a.download="TABLEUR-Clients.doc"; a.click(); window.open(url,'_blank'); }
window.onload=function(){
let sauve=null; try{ sauve=JSON.parse(localStorage.getItem("TABLEUR_FINAL")); }catch(e){}
if(sauve && sauve.clients && sauve.clients.length>0){ document.getElementById("capital").value=sauve.capital||1000; document.getElementById("pourcGlobal").value=sauve.pourc||30; sauve.clients.forEach(c=>creerLigne(c)); document.getElementById("debugText").innerText="✅ "+sauve.clients.length+" clients retrouvés automatiquement !"; }
else{ creerLigne({}); document.getElementById("debugText").innerText="ℹ️ Aucune sauvegarde trouvée. Mets un client et clique SAUVEGARDER pour tester."; }
calculer();
};
</script>
</body>
</html>
